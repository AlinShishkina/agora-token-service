services:
  postgres:
    image: postgres:16-alpine
    container_name: agora-postgres
    environment:
      POSTGRES_DB: agora_service
      POSTGRES_USER: agora_user
      POSTGRES_PASSWORD: agora_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora_user"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agora-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: agora-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agora_user:agora_password@postgres:5432/agora_service
      AGORA_APP_ID: ${AGORA_APP_ID:-test_app_id}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-test_certificate}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      API_KEY: ${API_KEY:-dev-api-key}
    depends_on:
      - postgres
    volumes:
      - ./app:/app/app
    restart: unless-stopped

volumes:
  postgres_data: